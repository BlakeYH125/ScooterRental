services:
  postgres:
    image: postgres:15-alpine
    container_name: scooter_rental_db
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: scooter_rental_app
    ports:
      - "${APP_PORT}:8080"
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      APP_PORT: "8080"
      LOG_FILE: /app/logs/scooter-rental.log
    volumes:
      - "${LOGS_DIR}:/app/logs"

volumes:
  postgres_data: