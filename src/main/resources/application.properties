spring.config.import=optional:file:.env[.properties]
server.port=${APP_PORT:8080}

database.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
database.username=${DATABASE_USERNAME}
database.password=${DATABASE_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}

logging.file.name=${LOG_FILE:logs/scooter-rental.log}

app.flyway.locations=classpath:db/migration,classpath:db/testdata